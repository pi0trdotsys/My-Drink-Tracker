<svg xmlns="http://www.w3.org/2000/svg" width="340" height="716" viewBox="0 0 340 716" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Ekran główny aplikacji Drink Tracker">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F2F7"/><stop offset="0.55" stop-color="#E3A54B"/><stop offset="1" stop-color="#F1F2F7"/>
    </linearGradient>
    <style>
      text{fill:#F1F2F7;}
      .ey{fill:#E3A54B;font-size:9px;font-weight:600;letter-spacing:1.6px;}
      .mut{fill:#A8ABB8;}
      .ok{fill:#45C08A;}.warn{fill:#E6B646;}.over{fill:#DE5140;}
    </style>
  </defs>

  <!-- device + screen -->
  <rect x="4" y="4" width="332" height="708" rx="34" fill="#0C0D12"/>
  <rect x="10" y="10" width="320" height="696" rx="29" fill="#171922"/>

  <!-- status bar -->
  <text x="28" y="36" font-size="13" font-weight="600">2:22</text>
  <g fill="#F1F2F7"><rect x="286" y="27" width="3" height="9" rx="1"/><rect x="291" y="24" width="3" height="12" rx="1"/><rect x="296" y="21" width="3" height="15" rx="1"/></g>
  <g><rect x="304" y="24" width="20" height="11" rx="2.5" fill="none" stroke="#F1F2F7" stroke-width="1.4"/><rect x="306" y="26" width="15" height="7" rx="1" fill="#F1F2F7"/></g>

  <!-- header -->
  <text class="ey" x="26" y="72">TWÓJ TYDZIEŃ</text>
  <text x="26" y="97" font-size="23" font-weight="800">Spożycie alkoholu</text>
  <circle cx="31" cy="114" r="5" fill="#45C08A"/>
  <text class="mut" x="43" y="118" font-size="11">Spokojna głowa – trzymasz się planu</text>

  <!-- widget card 4x2 -->
  <rect x="22" y="130" width="296" height="172" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text class="ey" x="38" y="156">TEN TYDZIEŃ</text>
  <text class="mut" x="302" y="156" font-size="10" text-anchor="end">27 lip – 2 sie</text>
  <text x="38" y="204" font-size="40" font-weight="800" fill="url(#gold)">9,8</text>
  <text class="mut" x="40" y="222" font-size="11">/ 14 SU limitu</text>

  <!-- bars -->
  <g>
    <!-- tracks -->
    <g fill="#2E313D" opacity="0.7">
      <rect x="150" y="162" width="15" height="58" rx="3"/><rect x="172" y="162" width="15" height="58" rx="3"/><rect x="194" y="162" width="15" height="58" rx="3"/><rect x="216" y="162" width="15" height="58" rx="3"/><rect x="238" y="162" width="15" height="58" rx="3"/><rect x="260" y="162" width="15" height="58" rx="3"/><rect x="282" y="162" width="15" height="58" rx="3"/>
    </g>
    <!-- values: Pn0 Wt2.6 Śr0 Cz3.2 Pt4.0 So0 Nd0 (max 4.9) -->
    <rect x="172" y="189" width="15" height="31" rx="3" fill="#E3A54B"/>
    <rect x="216" y="182" width="15" height="38" rx="3" fill="#E3A54B" stroke="#F1F2F799" stroke-width="1"/>
    <rect x="238" y="173" width="15" height="47" rx="3" fill="#E6B646"/>
    <g class="mut" font-size="8" text-anchor="middle">
      <text x="157" y="232">Pn</text><text x="179" y="232">Wt</text><text x="201" y="232">Śr</text><text x="223" y="232" fill="#F1F2F7" font-weight="600">Cz</text><text x="245" y="232">Pt</text><text x="267" y="232">So</text><text x="289" y="232">Nd</text>
    </g>
  </g>

  <!-- limit bar -->
  <rect x="38" y="246" width="264" height="6" rx="3" fill="#2E313D"/>
  <rect x="38" y="246" width="185" height="6" rx="3" fill="#45C08A"/>

  <!-- bottom row -->
  <text class="mut" x="38" y="282" font-size="11">3/4 dni z alkoholem</text>
  <rect x="238" y="270" width="64" height="20" rx="10" fill="#45C08A"/>
  <text x="270" y="284" font-size="10.5" font-weight="600" fill="#0E2C20" text-anchor="middle">W normie</text>

  <!-- BAC card -->
  <rect x="22" y="314" width="296" height="94" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text class="ey" x="38" y="340">SZACOWANY POZIOM ALKOHOLU</text>
  <text class="mut" x="302" y="340" font-size="9" text-anchor="end">Mężczyzna, 80 kg</text>
  <text x="38" y="384" font-size="34" font-weight="800" class="ok">0,0</text>
  <text class="mut" x="88" y="384" font-size="15">‰</text>
  <text x="112" y="372" font-size="15" font-weight="600" class="ok">Trzeźwy</text>
  <text class="mut" x="112" y="390" font-size="11">Brak alkoholu we krwi</text>

  <!-- stat tiles -->
  <g>
    <rect x="22" y="422" width="92" height="70" rx="18" fill="#23252F" stroke="#ffffff1f"/>
    <rect x="124" y="422" width="92" height="70" rx="18" fill="#23252F" stroke="#ffffff1f"/>
    <rect x="226" y="422" width="92" height="70" rx="18" fill="#23252F" stroke="#ffffff1f"/>
    <text x="36" y="460" font-size="20" font-weight="700">9,8</text><text class="mut" x="36" y="478" font-size="11">/ 14 SU</text>
    <text x="138" y="460" font-size="20" font-weight="700">3</text><text class="mut" x="138" y="478" font-size="11">/ 4 dni</text>
    <!-- sprout badge -->
    <path d="M247 456 q-7 -8 -14 -6 q2 8 14 6 z" fill="#45C08A"/><path d="M247 456 q7 -8 14 -6 q-2 8 -14 6 z" fill="#45C08A"/><rect x="246" y="456" width="2" height="7" fill="#45C08A"/>
    <text x="256" y="460" font-size="20" font-weight="700">2</text><text class="mut" x="240" y="478" font-size="10">trzeźwych dni</text>
  </g>

  <!-- preview label -->
  <text class="ey" x="26" y="524">PODGLĄD WIDGETU</text>
  <rect x="22" y="534" width="296" height="96" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text class="ey" x="38" y="558">TEN TYDZIEŃ</text>
  <circle cx="302" cy="555" r="5" fill="#45C08A"/>
  <text x="38" y="586" font-size="24" font-weight="800" fill="url(#gold)">9,8</text>
  <text class="mut" x="82" y="586" font-size="12">/ 14 SU</text>
  <g fill="#2E313D" opacity="0.7"><rect x="38" y="596" width="34" height="16" rx="3"/><rect x="76" y="596" width="34" height="16" rx="3"/><rect x="114" y="596" width="34" height="16" rx="3"/><rect x="152" y="596" width="34" height="16" rx="3"/><rect x="190" y="596" width="34" height="16" rx="3"/><rect x="228" y="596" width="34" height="16" rx="3"/><rect x="266" y="596" width="34" height="16" rx="3"/></g>
  <rect x="76" y="596" width="34" height="16" rx="3" fill="#E3A54B"/><rect x="190" y="600" width="34" height="12" rx="3" fill="#E6B646"/>

  <!-- bottom nav -->
  <rect x="10" y="648" width="320" height="58" rx="0" fill="#1d1f29"/>
  <rect x="46" y="662" width="70" height="30" rx="15" fill="#E3A54B"/>
  <path d="M74 671 l7 -6 l7 6 v9 h-14 z" fill="#2A2010"/>
  <text x="81" y="702" font-size="10" font-weight="600" fill="#E3A54B" text-anchor="middle">Tydzień</text>
  <g stroke="#A8ABB8" stroke-width="1.6"><line x1="163" y1="675" x2="177" y2="675"/><line x1="170" y1="668" x2="170" y2="682"/></g>
  <text x="170" y="702" font-size="10" class="mut" text-anchor="middle">Zaloguj</text>
  <circle cx="260" cy="675" r="6" fill="none" stroke="#A8ABB8" stroke-width="1.6"/><circle cx="260" cy="675" r="2" fill="#A8ABB8"/>
  <text x="260" y="702" font-size="10" class="mut" text-anchor="middle">Ustawienia</text>
</svg>
