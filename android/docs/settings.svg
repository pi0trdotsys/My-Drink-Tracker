<svg xmlns="http://www.w3.org/2000/svg" width="340" height="716" viewBox="0 0 340 716" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Ekran ustawień z kalkulatorem BAC">
  <defs><style>text{fill:#F1F2F7;}.ey{fill:#E3A54B;font-size:9px;font-weight:600;letter-spacing:1.4px;}.mut{fill:#A8ABB8;}</style></defs>
  <rect x="4" y="4" width="332" height="708" rx="34" fill="#0C0D12"/>
  <rect x="10" y="10" width="320" height="696" rx="29" fill="#171922"/>
  <text x="28" y="36" font-size="13" font-weight="600">2:22</text>
  <g fill="#F1F2F7"><rect x="286" y="27" width="3" height="9" rx="1"/><rect x="291" y="24" width="3" height="12" rx="1"/><rect x="296" y="21" width="3" height="15" rx="1"/></g>
  <g><rect x="304" y="24" width="20" height="11" rx="2.5" fill="none" stroke="#F1F2F7" stroke-width="1.4"/><rect x="306" y="26" width="15" height="7" rx="1" fill="#F1F2F7"/></g>

  <!-- Card 1: limity -->
  <rect x="22" y="54" width="296" height="272" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text x="38" y="86" font-size="17" font-weight="800">Ustawienia limitów</text>

  <text class="mut" x="38" y="114" font-size="11">Limit tygodniowy</text><text x="302" y="114" font-size="11" font-weight="600" text-anchor="end">14 SU</text>
  <rect x="38" y="124" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="124" width="123" height="4" rx="2" fill="#E3A54B"/><circle cx="161" cy="126" r="8" fill="#E3A54B"/>

  <text class="mut" x="38" y="152" font-size="11">Maks. dni z alkoholem w tygodniu</text><text x="302" y="152" font-size="11" font-weight="600" text-anchor="end">4 dni</text>
  <rect x="38" y="162" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="162" width="151" height="4" rx="2" fill="#E3A54B"/><circle cx="189" cy="164" r="8" fill="#E3A54B"/>

  <text class="mut" x="38" y="190" font-size="11">Definicja jednostki (g czystego etanolu)</text><text x="302" y="190" font-size="11" font-weight="600" text-anchor="end">10 g</text>
  <rect x="38" y="200" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="200" width="88" height="4" rx="2" fill="#E3A54B"/><circle cx="126" cy="202" r="8" fill="#E3A54B"/>

  <text class="mut" x="38" y="228" font-size="11">Próg ostrzeżenia</text><text x="302" y="228" font-size="11" font-weight="600" text-anchor="end">80% (11,2 SU)</text>
  <rect x="38" y="238" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="238" width="158" height="4" rx="2" fill="#E3A54B"/><circle cx="196" cy="240" r="8" fill="#E3A54B"/>

  <rect x="38" y="262" width="264" height="48" rx="14" fill="#2E313D99"/>
  <text x="54" y="285" font-size="11.5">Powiadomienia (ostrzeżenia +</text><text x="54" y="299" font-size="11.5">podsumowanie tygodnia)</text>
  <rect x="256" y="276" width="44" height="22" rx="11" fill="#E3A54B"/><circle cx="289" cy="287" r="8" fill="#2A2010"/>

  <!-- Card 2: BAC -->
  <rect x="22" y="338" width="296" height="168" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text x="38" y="368" font-size="17" font-weight="800">Kalkulator poziomu alkoholu</text>
  <text class="mut" x="38" y="386" font-size="10.5">Szacowanie promili we krwi (wzór Widmarka).</text>

  <text class="mut" x="38" y="414" font-size="11">Masa ciała</text><text x="302" y="414" font-size="11" font-weight="600" text-anchor="end">80 kg</text>
  <rect x="38" y="424" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="424" width="96" height="4" rx="2" fill="#E3A54B"/><circle cx="134" cy="426" r="8" fill="#E3A54B"/>

  <text class="mut" x="38" y="454" font-size="11">Płeć</text>
  <rect x="38" y="462" width="126" height="34" rx="14" fill="#E3A54B2E" stroke="#E3A54B"/><text x="101" y="484" font-size="12.5" font-weight="600" fill="#E3A54B" text-anchor="middle">Mężczyzna</text>
  <rect x="176" y="462" width="126" height="34" rx="14" fill="#2E313D99" stroke="#ffffff1f"/><text x="239" y="484" font-size="12.5" text-anchor="middle">Kobieta</text>

  <!-- Card 3: typy trunków -->
  <rect x="22" y="518" width="296" height="94" rx="20" fill="#23252F" stroke="#ffffff1f"/>
  <text class="ey" x="38" y="544">TYPY TRUNKÓW</text><text x="302" y="544" font-size="12" font-weight="600" fill="#E3A54B" text-anchor="end">+ Dodaj</text>
  <text x="38" y="574" font-size="15">🍺</text><text x="62" y="574" font-size="12.5">Piwo</text><text class="mut" x="302" y="574" font-size="9" text-anchor="end">500 ml · 5% · 2,0 SU</text>
  <text x="38" y="600" font-size="15">🍷</text><text x="62" y="600" font-size="12.5">Lampka wina</text><text class="mut" x="302" y="600" font-size="9" text-anchor="end">150 ml · 12% · 1,4 SU</text>

  <!-- bottom nav (Ustawienia active) -->
  <rect x="10" y="648" width="320" height="58" fill="#1d1f29"/>
  <path d="M74 671 l7 -6 l7 6 v9 h-14 z" fill="#A8ABB8"/>
  <text x="81" y="702" font-size="10" class="mut" text-anchor="middle">Tydzień</text>
  <g stroke="#A8ABB8" stroke-width="1.6"><line x1="163" y1="675" x2="177" y2="675"/><line x1="170" y1="668" x2="170" y2="682"/></g>
  <text x="170" y="702" font-size="10" class="mut" text-anchor="middle">Zaloguj</text>
  <rect x="225" y="662" width="70" height="30" rx="15" fill="#E3A54B"/>
  <circle cx="260" cy="675" r="6" fill="none" stroke="#2A2010" stroke-width="1.8"/><circle cx="260" cy="675" r="2" fill="#2A2010"/>
  <text x="260" y="702" font-size="10" font-weight="600" fill="#E3A54B" text-anchor="middle">Ustawienia</text>
</svg>
