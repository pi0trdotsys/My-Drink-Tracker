    <rect x="230" y="100" width="84" height="58" rx="16" fill="#2E313D99" stroke="#ffffff1f"/>
    <text x="242" y="126">🥃</text><text x="242" y="142" font-size="11" font-weight="600">Wódka</text><text class="mut" x="242" y="153" font-size="7.5">50 ml · 40%</text>

    <rect x="38" y="166" width="84" height="58" rx="16" fill="#2E313D99" stroke="#ffffff1f"/>
    <text x="50" y="192">🥃</text><text x="50" y="208" font-size="11" font-weight="600">Whisky</text><text class="mut" x="50" y="219" font-size="7.5">50 ml · 43%</text>
    <rect x="134" y="166" width="84" height="58" rx="16" fill="#2E313D99" stroke="#ffffff1f"/>
    <text x="146" y="192">🍸</text><text x="146" y="208" font-size="11" font-weight="600">Gin</text><text class="mut" x="146" y="219" font-size="7.5">250 ml · 9%</text>
    <rect x="230" y="166" width="84" height="58" rx="16" fill="#2E313D99" stroke="#ffffff1f"/>
    <text x="242" y="192">🍹</text><text x="242" y="208" font-size="11" font-weight="600">Drink</text><text class="mut" x="242" y="219" font-size="7.5">200 ml · 14%</text>

    <rect x="38" y="232" width="84" height="58" rx="16" fill="#2E313D99" stroke="#ffffff1f"/>
    <text x="50" y="258">🍾</text><text x="50" y="274" font-size="11" font-weight="600">Prosecco</text><text class="mut" x="50" y="285" font-size="7.5">120 ml · 11%</text>
  </g>

  <!-- name field -->
  <rect x="38" y="306" width="264" height="44" rx="10" fill="none" stroke="#E3A54B"/>
  <rect x="52" y="300" width="86" height="12" fill="#23252F"/><text class="ey" x="54" y="309" fill="#E3A54B" letter-spacing="0">Nazwa wpisu</text>
  <text x="54" y="333" font-size="14">Piwo</text>

