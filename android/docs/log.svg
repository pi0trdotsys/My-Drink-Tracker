  <!-- abv slider -->
  <text class="mut" x="38" y="418" font-size="11">Zawartość alkoholu</text><text x="302" y="418" font-size="11" font-weight="600" text-anchor="end">5,0%</text>
  <rect x="38" y="428" width="264" height="4" rx="2" fill="#2E313D"/><rect x="38" y="428" width="20" height="4" rx="2" fill="#E3A54B"/><circle cx="56" cy="430" r="9" fill="#E3A54B"/>

  <!-- Kiedy -->
  <text class="mut" x="38" y="472" font-size="11">Kiedy</text>
  <rect x="182" y="456" width="120" height="30" rx="14" fill="#2E313D99" stroke="#E3A54B"/>
  <circle cx="200" cy="471" r="6" fill="none" stroke="#E3A54B" stroke-width="1.4"/><line x1="200" y1="471" x2="200" y2="467" stroke="#E3A54B" stroke-width="1.4"/><line x1="200" y1="471" x2="203" y2="473" stroke="#E3A54B" stroke-width="1.4"/>
  <text x="214" y="475" font-size="12" font-weight="500">28 lip, 06:17</text>

  <!-- converter -->
  <rect x="38" y="500" width="264" height="72" rx="18" fill="#2E313D99"/>
  <text class="ey" x="56" y="528">PRZELICZNIK</text>
  <text x="56" y="558" font-size="28" font-weight="800">2,0 SU</text>
  <rect x="196" y="522" width="92" height="34" rx="17" fill="#E3A54B"/><text x="242" y="544" font-size="13" font-weight="600" fill="#2A2010" text-anchor="middle">Dodaj wpis</text>

  <!-- bottom nav (Zaloguj active) -->
  <rect x="10" y="648" width="320" height="58" fill="#1d1f29"/>
  <path d="M74 671 l7 -6 l7 6 v9 h-14 z" fill="#A8ABB8"/>
