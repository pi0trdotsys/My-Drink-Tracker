  <rect x="135" y="662" width="70" height="30" rx="15" fill="#E3A54B"/>
  <g stroke="#2A2010" stroke-width="2"><line x1="163" y1="677" x2="177" y2="677"/><line x1="170" y1="670" x2="170" y2="684"/></g>
  <text x="170" y="702" font-size="10" font-weight="600" fill="#E3A54B" text-anchor="middle">Zaloguj</text>
  <circle cx="260" cy="675" r="6" fill="none" stroke="#A8ABB8" stroke-width="1.6"/><circle cx="260" cy="675" r="2" fill="#A8ABB8"/>
  <text x="260" y="702" font-size="10" class="mut" text-anchor="middle">Ustawienia</text>
